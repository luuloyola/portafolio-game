<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Portafolio - Lu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }

    #joystick-zone {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 150px;
      height: 150px;
      z-index: 10;
      touch-action: none; /* evita que el navegador haga scroll/zoom al tocar el joystick */
    }
  </style>
</head>
<body>
  <div id="joystick-zone"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
